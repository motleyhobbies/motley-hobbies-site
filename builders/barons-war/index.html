nt-size:.95rem}.uo-cost{color:var(--red);font-weight:bold;font-family:Arial,sans-serif;white-space:nowrap}.mini{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0}.stat{min-width:36px;text-align:center}.stat .v{font-weight:bold}.stat .k{font-family:Arial,sans-serif;font-size:.55rem;color:var(--muted);text-transform:uppercase}.meta{font-family:Arial,sans-serif;font-size:.72rem;color:var(--muted);line-height:1.45}.meta strong{color:var(--brown)}.audit{color:#8a5b00;font-size:.69rem;font-family:Arial,sans-serif;margin-top:4px}.add{background:var(--green);color:#fff;margin-top:8px}.side{background:var(--paper);border-left:2px solid var(--border);position:sticky;top:0;height:calc(100vh - 118px);overflow:auto;display:flex;flex-direction:column}.side-head{background:var(--ink);color:#f6edd9;font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:.85rem;padding:11px 14px;position:sticky;top:0;z-index:2}.validation{background:#fbf6ea;border-bottom:1px solid var(--border);padding:8px 12px;font-family:Arial,sans-serif;font-size:.72rem;line-height:1.35}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:#8a5b00}.list{padding:11px 13px;flex:1}.entry{border-bottom:1px solid #eadcc4;padding:8px 0}.entry-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.entry-name{font-weight:bold;font-size:.86rem}.entry-cost{color:var(--red);font-weight:bold;font-family:Arial,sans-serif;white-space:nowrap}.entry-controls{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.entry-controls select,.entry-controls input,.entry textarea{font-size:.73rem;padding:4px;border:1px solid #cdb994;background:#fff;border-radius:2px}.entry textarea{width:100%;margin-top:5px;min-height:32px}.line{font-family:Arial,sans-serif;font-size:.68rem;color:var(--muted);margin-top:4px}.chkline{display:flex;gap:5px;align-items:center;font-family:Arial,sans-serif;font-size:.7rem;color:var(--brown);margin-top:3px}.row-btns{display:flex;gap:4px;margin-t const SAVE_KEY = "barons_war_2e_retinue_saves_v1";
let landingFilters = { groupBy: 'theater', source: 'all', nation: 'all', search: '' };
let state = { retinueId:null, listName:'', pointsLimit:500, entries:[] };
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function profile(id){return DATA.profiles[id]} function retinue(){return DATA.retinues.find(r=>r.id===state.retinueId)}
function money(n){return `${Math.round(n)} pts`}
function controlOptions(items, selected, allLabel){let html=`<option value="all" ${selected==='all'?'selected':''}>${esc(allLabel)}</option>`;items.forEach(x=>html+=`<option value="${esc(x)}" ${selected===x?'selected':''}>${esc(x)}</option>`);return html}
function renderLanding(){const sources=[...new Set(DATA.retinues.map(r=>r.source))].sort();const nations=[...new Set(DATA.retinues.map(r=>r.nation))].sort();const q=(landingFilters.search||'').toLowerCase();let filtered=DATA.retinues.filter(r=>(landingFilters.source==='all'||r.source===landingFilters.source)&&(landingFilters.nation==='all'||r.nation===landingFilters.nation)&&(!q||`${r.name} ${r.subtitle} ${r.theater} ${r.nation} ${r.source} ${r.trait}`.toLowerCase().includes(q)));let html=`<div class="filters"><div class="fg"><label>Group by</label><select onchange="landingFilters.groupBy=this.value;renderLanding()"><option value="theater" ${landingFilters.groupBy==='theater'?'selected':''}>Theater / Era</option><option value="source" ${landingFilters.groupBy==='source'?'selected':''}>Source</option><option value="nation" ${landingFilters.groupBy==='nation'?'selected':''}>Retinue Type</option></select></div><div class="fg"><label>Source</label><select onchange="landingFilters.source=this.value;renderLanding()">${controlOptions(sources,landingFilters.source,'All Sources')}</select></div><div class="fg"><label>Search</label><input type="search" value="${esc(landingFilters.search)}" oninput="landingFilters.search=this.value;renderLanding()" placeholder="retinue, source, region..."></div></div>`;let groups={};filtered.forEach(r=>{let key=landingFilters.groupBy==='source'?r.source:landingFilters.groupBy==='nation'?r.nation:r.theater;(groups[key]??=[]).push(r)});Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([k,arr])=>{html+=`<div class="group-label">${esc(k)}</div><div class="retinue-grid">`;arr.sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>{html+=`<div class="ret-card" onclick="pickRetinue('${esc(r.id)}')"><span class="arrow">→</span><div class="ret-name">${esc(r.name)}</div><div class="ret-sub">${esc(r.subtitle)}</div><div class="ret-meta">${esc(r.nation)} · ${esc(r.source)}</div><div class="ret-trait">${esc(r.trait)}</div></div>`});html+=`</div>`}); if(!filtered.length) html+=`<div class="ret-card">No retinues match your filters.</div>`;document.getElementById('land-content').innerHTML=html}
function pickRetinue(id){state={retinueId:id,listName:'',pointsLimit:500,entries:[]};document.getElementById('list-name').value='';document.getElementById('limit').value=500;showBuilder(true)}
function showBuilder(push){document.getElementById('landing').style.display='none';document.getElementById('builder').style.display='block';const r=retinue();document.getElementById('hdr-title').textContent=`The Barons' War — ${r.name}`;document.getElementById('hdr-sub').textContent=r.subtitle;document.getElementById('hdr-source').textContent=r.source;if(push) history.pushState({screen:'builder',retinueId:r.id},'',`#builder-${r.id}`);render()}
function goHome(){document.getElementById('landing').style.display='block';document.getElementById('builder').style.display='none';state.retinueId=null;if(location.hash) history.pushState({screen:'landing'},'',location.pathname)}
window.addEventListener('popstate',()=>{if(state.retinueId){goHome()}else{document.getElementById('landing').style.display='block';document.getElementById('builder').style.display='none'}});
function defaultEntry(p){const exp=Object.keys(p.costs)[0];return {eid:uid(),profileId:p.id,category:p.category,count:p.category==='Commander'?1:p.minSize,experience:exp,weapon:p.weaponOptions[0],armor:p.armorOptions[0],shield:p.shieldOptions[0],mount:p.mountOptions[0],abilities:[],cmdUpgrades:[],notes:''}}
function addProfile(id){state.entries.push(defaultEntry(profile(id)));render();toast('Added to retinue')}
function removeEntry(eid){state.entries=state.entries.filter(e=>e.eid!==eid);render()}
function updateEntry(eid,field,val){const e=state.entries.find(x=>x.eid===eid);if(!e)return;if(field==='count') e.count=Math.max(profile(e.profileId).minSize,parseInt(val)||profile(e.profileId).minSize);else e[field]=val;render()}
function toggleAbility(eid,id,kind){const e=state.entries.find(x=>x.eid===eid);const arr=kind==='cmd'?e.cmdUpgrades:e.abilities;const i=arr.indexOf(id); if(i>=0) arr.splice(i,1); else arr.push(id); render()}
function statsFor(e){const p=profile(e.profileId);const base=DATA.tierStats[p.tier].experiences[e.experience]||DATA.tierStats[p.tier].experiences[Object.keys(DATA.tierStats[p.tier].experiences)[0]];const armor=DATA.armor[e.armor]||DATA.armor.None;const mount=DATA.mounts[e.mount]||DATA.mounts.None;return {move:Math.max(1,base.move+(armor.moveMod||0)+(mount.moveMod||0)),attack:base.attack,defence:base.defence+(armor.defMod||0)+(mount.defMod||0),morale:base.morale,actions:DATA.tierStats[p.tier].actions}}
function entryCost(e){const p=profile(e.profileId);const base=p.costs[e.experience]||0;const equip=(DATA.weapons[e.weapon]?.cost||0)+(DATA.armor[e.armor]?.cost||0)+(DATA.shields[e.shield]?.cost||0)+(DATA.mounts[e.mount]?.cost||0);const abil=e.abilities.reduce((s,a)=>s+(DATA.abilities[a]?.cost||0),0);const unit=(base+equip+abil)*e.count;const cmd=e.cmdUpgrades.reduce((s,a)=>s+(DATA.commandUpgrades[a]?.cost||0),0);return unit+cmd}
function total(){return state.entries.reduce((s,e)=>s+entryCost(e),0)}
function commandSpend(){return state.entries.filter(e=>profile(e.profileId).category==='Commander').reduce((s,e)=>s+entryCost(e),0)}
function greenSpend(){return state.entries.filter(e=>e.experience==='Green').reduce((s,e)=>s+entryCost(e),0)}
function renderProfileCard(p){let sample={profileId:p.id,experience:Object.keys(p.costs)[0],weapon:p.weaponOptions[0],armor:p.armorOptions[0],shield:p.shieldOptions[0],mount:p.mountOptions[0]};let st=statsFor(sample);let costRange=Object.entries(p.costs).map(([k,v])=>`${k} ${v}`).join(' / ');return `<div class="unit-option"><div class="uo-head"><div><div class="uo-name">${esc(p.name)}</div><div class="meta">${esc(p.category)} · ${esc(p.source)}</div></div><div class="uo-cost">${esc(costRange)}</div></div><div class="mini"><div class="stat"><div class="v">${st.move}</div><div class="k">Move</div></div><div class="stat"><div class="v">${st.attack}+</div><div class="k">Attack</div></div><div class="stat"><div class="v">${st.defence}+</div><div class="k">Defence</div></div><div class="stat"><div class="v">${st.morale}+</div><div class="k">Morale</div></div><div class="stat"><div class="v">${DATA.tierStats[p.tier].actions}</div><div class="k">Actions</div></div></div><div class="meta"><strong>Inherent:</strong> ${esc(p.inherent.join(', ')||'—')}<br><strong>Weapons:</strong> ${esc(p.weaponOptions.join(', '))}<br><strong>Armour/Shields:</strong> ${esc(p.armorOptions.join(', '))} / ${esc(p.shieldOptions.join(', '))}${p.mountOptions.length>1?`<br><strong>Mount:</strong> ${esc(p.mountOptions.join(', '))}`:''}</div>${p.notes?`<div class="meta"><strong>Notes:</strong> ${esc(p.notes)}</div>`:''}${p.audit?`<div class="audit">Audit note: sourcebook-specific values/options should be checked against the PDF before competitive use.</div>`:''}<button class="btn add" onclick="addProfile('${esc(p.id)}')">Add</button></div>`}
function renderPanels(){const r=retinue();let ps=r.profiles.map(id=>profile(id)).filter(Boolean);document.getElementById('cmd-panel').innerHTML=ps.filter(p=>p.category==='Commander').map(renderProfileCard).join('');document.getElementById('grp-panel').innerHTML=ps.filter(p=>p.category!=='Commander').map(renderProfileCard).join('')}
function opt(vals,sel){return vals.map(v=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(v)}</option>`).join('')}
function renderEntry(e){const p=profile(e.profileId);const st=statsFor(e);const cost=entryCost(e);const abilities=Object.keys(DATA.abilities).filter(a=>!p.inherent.includes(a));const allowedCmd=p.commandUpgrades||[];return `<div class="entry"><div class="entry-top"><div><div class="entry-name">${esc(p.name)} ${p.category!=='Commander'?`× ${e.count}`:''}</div><div class="line">${esc(e.experience)} · ${esc(p.category)} · ${esc(p.source)}</div></div><div class="entry-cost">${money(cost)}</div></div><div class="entry-controls"><select onchange="updateEntry('${e.eid}','experience',this.value)">${opt(Object.keys(p.costs),e.experience)}</select>${p.category==='Commander'?`<input value="Commander" disabled>`:`<input type="number" min="${p.minSize}" value="${e.count}" onchange="updateEntry('${e.eid}','count',this.value)">`}<select onchange="updateEntry('${e.eid}','weapon',this.value)">${opt(p.weaponOptions,e.weapon)}</select><select onchange="updateEntry('${e.eid}','armor',this.value)">${opt(p.armorOptions,e.armor)}</select><select onchange="updateEntry('${e.eid}','shield',this.value)">${opt(p.shieldOptions,e.shield)}</select><select onchange="updateEntry('${e.eid}','mount',this.value)">${opt(p.mountOptions,e.mount)}</select></div><div class="line">Stats after equipment: M ${st.move} · A ${st.attack}+ · D ${st.defence}+ · Morale ${st.morale}+ · Actions ${st.actions}</div>${allowedCmd.length?`<div class="line"><strong>Command upgrades:</strong></div>${allowedCmd.map(a=>`<label class="chkline"><input type="checkbox" ${e.cmdUpgrades.includes(a)?'checked':''} onchange="toggleAbility('${e.eid}','${esc(a)}','cmd')"> ${esc(a)} (+${DATA.commandUpgrades[a]?.cost||0})</label>`).join('')}`:''}<details><summary class="line">Purchasable abilities</summary>${abilities.map(a=>`<label class="chkline"><input type="checkbox" ${e.abilities.includes(a)?'checked':''} onchange="toggleAbility('${e.eid}','${esc(a)}','ability')"> ${esc(a)} (+${DATA.abilities[a]?.cost||0})</label>`).join('')}</details><textarea placeholder="Notes for this Group" oninput="updateEntry('${e.eid}','notes',this.value)">${esc(e.notes||'')}</textarea><div class="row-btns"><button class="smallbtn remove" onclick="removeEntry('${e.eid}')">Remove</button></div></div>`}
function validation(){let msgs=[];const t=total(), lim=state.pointsLimit;const commanders=state.entries.filter(e=>profile(e.profileId).category==='Commander');if(!commanders.length) msgs.push(['err','Add at least one Commander and designate your Retinue Leader.']); else msgs.push(['ok','At least one Commander selected.']);if(t>lim) msgs.push(['err',`Over points limit by ${t-lim} pts.`]); else msgs.push(['ok',`${lim-t} pts remaining.`]);const cmd=commandSpend();if(cmd>lim*.5) msgs.push(['warn',`Commanders currently exceed 50% of the points limit (${cmd}/${Math.floor(lim*.5)} pts). Include linked Command Group costs when auditing.`]);const green=greenSpend();if(green<lim*.1) msgs.push(['warn',`Green troops are below the usual 10% requirement (${green}/${Math.ceil(lim*.1)} pts). Mercenary/combined rules may modify this.`]);state.entries.forEach(e=>{const p=profile(e.profileId);if(p.category!=='Commander'&&e.count<p.minSize) msgs.push(['err',`${p.name} is below minimum size.`])});return msgs}
function render(){if(!state.retinueId)return;renderPanels();document.getElementById('entries').innerHTML=state.entries.length?state.entries.map(renderEntry).join(''):`<div class="line">No Groups selected yet.</div>`;let t=total();document.getElementById('top-total').textContent=`${t} / ${state.pointsLimit}`;document.getElementById('footer-total').textContent=money(t);document.getElementById('validation').innerHTML=validation().map(([c,m])=>`<div class="${c}">${c==='ok'?'✓':c==='err'?'✗':'!'} ${esc(m)}</div>`).join('')}
function saveList(){if(!state.retinueId){toast('Choose a retinue first');return}let name=(state.listName||document.getElementById('list-name').value||retinue().name+' Retinue').trim();state.listName=name;let saves=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');saves[name]={...state,savedAt:new Date().toISOString()};localStorage.setItem(SAVE_KEY,JSON.stringify(saves));toast(`Saved ${name}`)}
function openSaves(){let saves=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');let keys=Object.keys(saves).sort();let html=keys.length?keys.map(k=>{let s=saves[k];return `<div class="slot"><div><div class="slot-name">${esc(k)}</div><div class="slot-meta">${esc(s.retinueId)} · ${s.entries?.length||0} Groups · ${new Date(s.savedAt).toLocaleDateString()}</div></div><div><button class="smallbtn" data-load="${esc(k)}">Load</button> <button class="smallbtn remove" data-del="${esc(k)}">Delete</button></div></div>`}).join(''):`<div class="line">No saved retinues in this browser.</div>`;document.getElementById('save-body').innerHTML=html;document.getElementById('save-modal').style.display='flex';document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>loadList(b.dataset.load));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteSave(b.dataset.del))}
function closeSaves(){document.getElementById('save-modal').style.display='none'}
function loadList(k){let saves=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');if(!saves[k])return;state=saves[k];document.getElementById('list-name').value=state.listName||'';document.getElementById('limit').value=state.pointsLimit||500;closeSaves();showBuilder(true);toast('Loaded saved retinue')}
function deleteSave(k){let saves=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');delete saves[k];localStorage.setItem(SAVE_KEY,JSON.stringify(saves));openSaves()}
function clearList(){if(confirm('Clear this retinue?')){state.entries=[];render()}}
function rulesFor(e){const p=profile(e.profileId);let names=[...p.inherent,...e.abilities,...e.cmdUpgrades];return names.map(n=>{let d=DATA.abilities[n]?.text||DATA.commandUpgrades[n]?.text||'Definition not in builder; check the source book.';return `<div class="rule"><strong>${esc(n)}:</strong> ${esc(d)}</div>`}).join('')}
function entrySummary(e){const p=profile(e.profileId);return `${e.count} ${p.category==='Commander'?'': '× '}${p.name} (${e.experience}) — ${e.weapon}, ${e.armor}, ${e.shield}${e.mount!=='None'?`, ${e.mount}`:''}`}
function generatePrint(){const r=retinue();let t=total();let html=`<div class="print-page"><div class="p-head"><h1>${esc(state.listName||r.name)}</h1><div class="p-meta">${esc(r.name)} · ${esc(r.subtitle)} · Source: ${esc(r.source)}</div><div class="p-meta">${t} / ${state.pointsLimit} points</div></div><div class="p-section"><h2>Retinue Summary</h2>${state.entries.map(e=>`<div class="p-row"><span>${esc(entrySummary(e))}</span><strong>${money(entryCost(e))}</strong></div>`).join('')}</div></div><div class="print-page"><div class="cards">`;state.entries.forEach(e=>{const p=profile(e.profileId), st=statsFor(e);html+=`<div class="card"><div class="card-h"><div class="card-title">${esc(p.name)} ${p.category!=='Commander'?`× ${e.count}`:''}</div><div class="card-sub">${esc(p.category)} · ${money(entryCost(e))} · Source: ${esc(p.source)}</div></div><table><tr><th>Move</th><th>Attack</th><th>Defence</th><th>Morale</th><th>Actions</th></tr><tr><td>${st.move}</td><td>${st.attack}+</td><td>${st.defence}+</td><td>${st.morale}+</td><td>${st.actions}</td></tr></table><div class="card-info"><strong>Equipment:</strong> ${esc(e.weapon)}, ${esc(e.armor)}, ${esc(e.shield)}${e.mount!=='None'?`, ${esc(e.mount)}`:''}</div><div class="card-info"><strong>Inherent/Purchased Rules:</strong>${rulesFor(e)||' —'}</div>${e.notes?`<div class="card-info"><strong>Notes:</strong> ${esc(e.notes)}</div>`:''}</div>`});html+=`</div></div>`;document.getElementById('print-view').innerHTML=html;window.print()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
renderLanding();
</script>
</body>
