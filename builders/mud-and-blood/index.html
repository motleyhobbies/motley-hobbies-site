<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood &amp; Valor — Army Builder</title>
<style>
:root {
  --bg:     #E8DCC8; --dark:   #2C1A0E; --brown:  #5C3D1E;
  --red:    #8B1A1A; --gold:   #C8941A; --green:  #2D4A2D;
  --border: #A08060; --muted:  #7A6040; --white:  #FFFDF5;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Georgia', serif; background: var(--bg); color: var(--dark); min-height: 100vh; }

/* ── LANDING ── */
.land-wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
.land-hero {
  background: var(--dark); color: #F5EDD8; text-align: center;
  padding: 32px 24px 24px; border-bottom: 4px solid var(--gold); margin-bottom: 30px;
}
.land-hero h1 { font-size: 2.4rem; letter-spacing: 0.12em; text-transform: uppercase; }
.land-hero p  { color: var(--gold); font-size: 0.9rem; letter-spacing: 0.08em; margin-top: 6px; font-family: sans-serif; }
.land-hero .land-sub { color: rgba(245,237,216,0.55); font-size: 0.78rem; margin-top: 4px; font-style: italic; }

.theater-block { margin-bottom: 28px; }
.theater-label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
  border-bottom: 2px solid var(--border); padding-bottom: 5px; margin-bottom: 12px;
  font-family: sans-serif;
}
.faction-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.faction-card {
  background: var(--white); border: 1px solid var(--border); border-radius: 4px;
  padding: 14px 16px; cursor: pointer; transition: all 0.18s;
  border-left: 4px solid var(--gold);
}
.faction-card:hover { background: #FBF6EC; box-shadow: 0 3px 12px rgba(0,0,0,0.12); transform: translateY(-1px); }
.fc-name   { font-size: 1rem; font-weight: bold; color: var(--dark); line-height: 1.25; }
.fc-sub    { font-size: 0.72rem; color: var(--muted); font-family: sans-serif; margin-top: 2px; }
.fc-motto  { font-size: 0.7rem; color: var(--brown); font-style: italic; margin-top: 6px; border-top: 1px solid #E8DCC8; padding-top: 5px; line-height: 1.4; }
.fc-arrow  { float: right; color: var(--gold); font-size: 1.1rem; margin-left: 8px; }

/* ── LANDING FILTERS ── */
.filter-bar {
  background: var(--white); border: 1px solid var(--border); border-left: 4px solid var(--gold);
  border-radius: 4px; padding: 12px 14px; margin-bottom: 18px;
  display: grid; grid-template-columns: minmax(140px, 1fr) minmax(150px, 1fr) minmax(150px, 1fr) minmax(180px, 1fr);
  gap: 10px; align-items: end;
}
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--brown);
  font-family: sans-serif; font-weight: bold;
}
.filter-group select, .filter-group input {
  width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 3px;
  background: #FFFDF5; color: var(--dark); font-family: sans-serif; font-size: 0.86rem;
}
.fc-meta {
  font-size: 0.66rem; color: var(--brown); font-family: sans-serif; margin-top: 4px;
  text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.25;
}
.no-factions {
  background: var(--white); border: 1px dashed var(--border); color: var(--muted);
  padding: 18px; border-radius: 4px; text-align: center; font-family: sans-serif; font-size: 0.9rem;
}
@media (max-width: 760px) {
  .filter-bar { grid-template-columns: 1fr; }
}


/* ── HEADER ── */
.app-header {
  background: var(--dark); color: #F5EDD8; padding: 14px 24px;
  border-bottom: 3px solid var(--gold);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
}
.app-header h1 { font-size: 1.45rem; letter-spacing: 0.08em; text-transform: uppercase; }
.app-header .faction { font-size: 0.82rem; color: var(--gold); margin-top: 2px; }
.app-header .motto   { font-size: 0.7rem; color: rgba(245,237,216,0.6); font-style: italic; margin-top: 1px; }
.btn-home {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
  color: #F5EDD8; padding: 5px 14px; font-size: 0.78rem; border-radius: 3px;
  cursor: pointer; font-family: sans-serif; transition: background 0.2s;
}
.btn-home:hover { background: rgba(255,255,255,0.2); }

/* ── CONFIG BAR ── */
.config-bar {
  background: var(--brown); padding: 9px 24px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  border-bottom: 2px solid var(--dark);
}
.config-bar label { color: rgba(245,237,216,0.75); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; font-family: sans-serif; }
.config-bar input {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3);
  color: #F5EDD8; padding: 5px 10px; border-radius: 3px; font-size: 0.92rem; font-family: 'Georgia', serif; outline: none;
}
.config-bar input::placeholder { color: rgba(245,237,216,0.4); }
.config-bar input:focus { border-color: var(--gold); }
#army-name-input    { width: 220px; }
#points-limit-input { width: 72px; }
.cfg-group { display: flex; align-items: center; gap: 8px; }
.pts-tracker { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.pts-display { font-size: 1.45rem; font-weight: bold; color: #F5EDD8; }
.pts-display .over { color: #ff8080; }
.pts-display .ok   { color: #A8DCA8; }
.pts-label { font-size: 0.7rem; color: rgba(245,237,216,0.6); font-family: sans-serif; }
.btn-print {
  background: var(--gold); color: var(--dark); border: none;
  padding: 7px 18px; font-size: 0.85rem; font-weight: bold; border-radius: 3px;
  cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em; font-family: sans-serif;
  transition: background 0.2s;
}
.btn-print:hover { background: #e0a820; }

/* ── MAIN LAYOUT ── */
.builder-main {
  display: grid; grid-template-columns: 1fr 340px;
  min-height: calc(100vh - 118px); max-width: 1400px; margin: 0 auto;
}
.unit-panels { padding: 16px 20px; overflow-y: auto; }
.section-head {
  background: var(--dark); color: #F5EDD8; padding: 9px 16px;
  border-radius: 4px 4px 0 0;
  display: flex; justify-content: space-between; align-items: center; margin-top: 22px;
}
.section-head:first-child { margin-top: 0; }
.section-head h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.08em; font-family: sans-serif; }
.badge-req { background: var(--gold); color: var(--dark); font-size: 0.68rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-family: sans-serif; }
.badge-opt { background: rgba(255,255,255,0.15); color: #F5EDD8; font-size: 0.68rem; padding: 2px 8px; border-radius: 10px; font-family: sans-serif; }
.unit-panel { background: var(--white); border: 1px solid var(--border); border-top: none; border-radius: 0 0 4px 4px; margin-bottom: 4px; }
.unit-option { padding: 12px 16px; border-bottom: 1px solid #E8DCC8; transition: background 0.15s; }
.unit-option:last-child { border-bottom: none; }
.unit-option:hover { background: #FBF6EC; }
.unit-opt-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.unit-name { font-size: 0.95rem; font-weight: bold; color: var(--dark); }
.unit-name.unique::after { content: " ★"; color: var(--gold); font-size: 0.8rem; }
.unit-subtype { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-family: sans-serif; margin-top: 1px; }
.unit-cost-block { text-align: right; margin-left: 12px; white-space: nowrap; }
.cost-main  { font-size: 1.05rem; font-weight: bold; color: var(--red); }
.cost-extra { font-size: 0.67rem; color: var(--muted); font-family: sans-serif; }
.mini-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.stat-cell  { display: flex; flex-direction: column; align-items: center; min-width: 38px; }
.stat-val   { font-size: 1rem; font-weight: bold; color: var(--dark); }
.stat-key   { font-size: 0.57rem; color: var(--muted); text-transform: uppercase; white-space: nowrap; font-family: sans-serif; }
.unit-lore  { font-size: 0.74rem; font-style: italic; color: var(--brown); margin-bottom: 5px; line-height: 1.5; padding: 4px 0 0; }
.unit-meta  { font-size: 0.74rem; color: var(--muted); margin-bottom: 5px; line-height: 1.5; font-family: sans-serif; }
.unit-meta strong { color: var(--brown); }
.unit-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.btn-add, .btn-select {
  border: none; padding: 5px 14px; font-size: 0.8rem; font-weight: bold; border-radius: 3px;
  cursor: pointer; font-family: sans-serif; transition: background 0.2s;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.btn-add { background: var(--green); color: white; }
.btn-add:hover:not(:disabled) { background: #1a331a; }
.btn-add:disabled { background: #aaa; cursor: not-allowed; }
.btn-select { background: var(--dark); color: white; min-width: 90px; }
.btn-select:hover:not(:disabled) { background: var(--brown); }
.btn-select.selected { background: var(--gold); color: var(--dark); }
.btn-select:disabled { opacity: 0.4; cursor: not-allowed; }
.limit-note    { font-size: 0.7rem; color: var(--muted); font-style: italic; font-family: sans-serif; }
.in-army-badge { font-size: 0.75rem; color: var(--green); font-weight: bold; font-family: sans-serif; }

/* ── ARMY LIST (right) ── */
.army-list {
  background: var(--white); border-left: 2px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: calc(100vh - 118px); overflow-y: auto;
}
.list-header {
  background: var(--dark); color: #F5EDD8; padding: 11px 16px;
  font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.07em; font-family: sans-serif;
  position: sticky; top: 0;
}
.validation-bar {
  padding: 8px 14px; font-size: 0.74rem; display: flex; flex-direction: column; gap: 3px;
  border-bottom: 1px solid var(--border); background: #FBF6EC; font-family: sans-serif;
}
.v-ok  { color: var(--green); } .v-ok::before  { content: "✓ "; }
.v-err { color: var(--red);   } .v-err::before { content: "✗ "; }
.v-warn { color: #8B5C1A; } .v-warn::before { content: "! "; }
.list-body { padding: 10px 14px; flex: 1; }
.list-section-label {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  margin: 12px 0 4px; border-bottom: 1px solid #E8DCC8; padding-bottom: 3px; font-family: sans-serif;
}
.list-section-label:first-child { margin-top: 0; }
.list-row { padding: 5px 0; border-bottom: 1px solid #F0E8D8; }
.list-row:last-child { border-bottom: none; }
.list-row-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.list-unit-name   { font-size: 0.8rem; font-weight: bold; color: var(--dark); flex: 1; }
.list-cost        { font-size: 0.83rem; font-weight: bold; color: var(--red); white-space: nowrap; font-family: sans-serif; }
.list-empty       { color: var(--muted); font-size: 0.78rem; font-style: italic; padding: 6px 0; font-family: sans-serif; }
.unit-actions { display: flex; align-items: center; gap: 5px; }
.stepper { display: flex; align-items: center; gap: 3px; }
.stepper button {
  background: #E8DCC8; border: 1px solid var(--border); width: 22px; height: 22px;
  font-size: 0.9rem; font-weight: bold; cursor: pointer; border-radius: 2px; color: var(--dark);
  display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.stepper button:hover { background: var(--gold); }
.stepper .mdl-count { font-size: 0.76rem; min-width: 18px; text-align: center; font-weight: bold; font-family: sans-serif; }
.mdl-label { font-size: 0.62rem; color: var(--muted); font-family: sans-serif; }
.btn-remove {
  background: none; border: 1px solid #ddd; color: var(--red);
  width: 22px; height: 22px; font-size: 0.85rem; cursor: pointer; border-radius: 2px;
  display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.btn-remove:hover { background: #fee; border-color: var(--red); }
.unit-notes-input {
  width: 100%; margin-top: 4px; padding: 3px 6px;
  font-size: 0.72rem; font-family: sans-serif; font-style: italic;
  border: 1px solid #ddd; border-radius: 2px; color: var(--muted);
  background: #FDFAF4; outline: none;
}
.unit-notes-input:focus { border-color: var(--gold); color: var(--dark); background: white; }
.unit-notes-input::placeholder { color: #C0A880; }
.upgrade-list { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
.upgrade-check {
  display: flex; align-items: center; gap: 6px; font-size: 0.72rem;
  color: var(--brown); font-family: sans-serif; line-height: 1.3;
}
.upgrade-check input { margin: 0; }
.upgrade-note { font-size: 0.68rem; color: var(--muted); font-family: sans-serif; font-style: italic; }

/* ── FOOTER ── */
.list-footer { padding: 10px 14px; border-top: 2px solid var(--border); background: #FBF6EC; position: sticky; bottom: 0; }
.total-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 1rem; font-family: sans-serif; }
.total-row .over { color: var(--red); } .total-row .ok { color: var(--green); }
.footer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px; }
.btn-footer {
  border: 1px solid var(--border); padding: 5px; font-size: 0.76rem; cursor: pointer;
  border-radius: 3px; font-family: sans-serif; transition: all 0.2s; background: none; color: var(--muted);
}
.btn-footer.btn-save     { background: var(--dark); color: #F5EDD8; border-color: var(--dark); }
.btn-footer.btn-save:hover { background: var(--brown); }
.btn-footer.btn-load     { background: var(--brown); color: #F5EDD8; border-color: var(--brown); }
.btn-footer.btn-load:hover { background: var(--dark); }
.btn-footer.btn-clear    { grid-column: span 2; }
.btn-footer.btn-clear:hover { background: #fee; border-color: var(--red); color: var(--red); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.modal-box {
  background: var(--white); border: 2px solid var(--dark); border-radius: 5px;
  width: 400px; max-height: 70vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
.modal-head {
  background: var(--dark); color: #F5EDD8; padding: 10px 16px;
  display: flex; justify-content: space-between; align-items: center; font-family: sans-serif;
  font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.06em;
}
.modal-head button { background: none; border: none; color: #F5EDD8; font-size: 1.1rem; cursor: pointer; }
.modal-body { padding: 12px; overflow-y: auto; flex: 1; }
.save-slot {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 3px; margin-bottom: 6px;
  background: white;
}
.save-slot-name  { font-size: 0.88rem; font-weight: bold; color: var(--dark); font-family: sans-serif; }
.save-slot-meta  { font-size: 0.72rem; color: var(--muted); font-family: sans-serif; margin-top: 2px; }
.save-slot-btns  { display: flex; gap: 5px; }
.btn-slot-load { background: var(--green); color: white; border: none; padding: 3px 10px; font-size: 0.75rem; border-radius: 2px; cursor: pointer; font-family: sans-serif; }
.btn-slot-del  { background: none; border: 1px solid #ddd; color: var(--red); padding: 3px 8px; font-size: 0.75rem; border-radius: 2px; cursor: pointer; font-family: sans-serif; }
.modal-empty { text-align: center; padding: 24px; color: var(--muted); font-style: italic; font-family: sans-serif; font-size: 0.85rem; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--dark); color: #F5EDD8; padding: 8px 20px; border-radius: 20px;
  font-size: 0.85rem; font-family: sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000;
  border-left: 4px solid var(--gold);
}
.toast.show { opacity: 1; }

/* ── PRINT ── */
#print-view { display: none; }
@media print {
  body { background: white; }
  #landing, #builder { display: none !important; }
  #save-modal, .toast { display: none !important; }
  #print-view { display: block !important; }
  .print-page { padding: 12mm 14mm; page-break-after: always; }
  .print-page:last-child { page-break-after: avoid; }
  .sum-header { border-bottom: 3px solid #2C1A0E; padding-bottom: 10px; margin-bottom: 14px; }
  .sum-header h1 { font-size: 22pt; color: #2C1A0E; text-transform: uppercase; letter-spacing: 0.1em; font-family: 'Georgia', serif; }
  .sum-header .sum-faction { font-size: 10pt; color: #5C3D1E; font-family: sans-serif; }
  .sum-header .sum-motto   { font-size: 8pt; color: #888; font-style: italic; font-family: sans-serif; }
  .sum-header .sum-pts     { font-size: 13pt; font-weight: bold; color: #8B1A1A; margin-top: 5px; font-family: sans-serif; }
  .sum-header .sum-source  { font-size: 8pt; color: #5C3D1E; margin-top: 3px; font-family: sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
  .sum-section { margin-bottom: 12px; }
  .sum-section h2 { font-size: 9pt; text-transform: uppercase; letter-spacing: 0.07em; background: #2C1A0E; color: white; padding: 3px 8px; margin-bottom: 0; font-family: sans-serif; }
  .sum-row { display: flex; justify-content: space-between; padding: 3px 8px; font-size: 8.5pt; border-bottom: 0.5px solid #E8DCC8; font-family: sans-serif; align-items: baseline; }
  .sum-row:nth-child(odd) { background: #FBF6EC; }
  .sum-row-name   { font-weight: bold; color: #2C1A0E; flex: 2; }
  .sum-row-detail { color: #666; flex: 3; text-align: center; }
  .sum-row-pts    { font-weight: bold; color: #8B1A1A; text-align: right; flex: 1; }
  .sum-row-notes  { font-size: 7pt; color: #888; font-style: italic; padding: 1px 8px 3px; font-family: sans-serif; }
  .sum-rules-box { padding: 5px 8px; font-size: 7.5pt; font-family: sans-serif; border-top: 0.5px solid #E8DCC8; }
  .sum-rules-box .rule-name { font-weight: bold; color: #2C1A0E; text-transform: uppercase; margin-right: 4px; }
  .cards-page { padding: 8mm 10mm; }
  .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .unit-card { border: 1.5px solid #2C1A0E; border-radius: 3px; overflow: hidden; break-inside: avoid; page-break-inside: avoid; background: white; }
  .card-header { background: #2C1A0E; color: white; padding: 5px 9px; }
  .card-title { font-size: 9.5pt; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; font-family: sans-serif; line-height: 1.2; }
  .card-sub   { font-size: 6.5pt; color: #C8941A; margin-top: 1px; font-family: sans-serif; letter-spacing: 0.05em; }
  .card-source { font-size: 6pt; color: #D8C08A; margin-top: 2px; font-family: sans-serif; letter-spacing: 0.04em; }
  .card-stat-table { width: 100%; border-collapse: collapse; }
  .card-stat-table th { background: #E8DCC8; color: #2C1A0E; font-size: 6pt; text-transform: uppercase; padding: 2px 3px; text-align: center; border: 0.5px solid #C8B090; font-family: sans-serif; }
  .card-stat-table td { text-align: center; padding: 3px 3px; font-weight: bold; font-size: 9pt; border: 0.5px solid #E8DCC8; font-family: 'Georgia', serif; }
  .card-info { padding: 3px 8px; font-size: 7pt; border-top: 0.5px solid #E8DCC8; line-height: 1.5; font-family: sans-serif; }
  .card-rule { margin-top: 2px; line-height: 1.35; }
  .card-info strong { color: #2C1A0E; text-transform: uppercase; font-size: 6.5pt; letter-spacing: 0.04em; }
  .card-notes { color: #555; font-style: italic; background: #FDFAF4; }
  .barrage-placeholder { padding: 8px; text-align: center; font-size: 8pt; color: #888; font-style: italic; font-family: sans-serif; border-bottom: 0.5px solid #E8DCC8; }
}
</style>
</head>
<body>

<!-- ══ LANDING PAGE ══ -->
<div id="landing">
  <div class="land-hero">
    <h1>Blood &amp; Valor</h1>
    <p>Army Builder</p>
    <div class="land-sub">Select a faction to begin building your force</div>
  </div>
  <div class="land-wrap" id="land-content"></div>
</div>

<!-- ══ BUILDER ══ -->
<div id="builder" style="display:none">
  <header class="app-header">
    <div>
      <h1 id="hdr-title">Blood &amp; Valor — Army Builder</h1>
      <div class="faction" id="hdr-faction"></div>
      <div class="motto"   id="hdr-motto"></div>
    </div>
    <button class="btn-home" onclick="goHome()">&#8592; Change Faction</button>
  </header>
  <div class="config-bar">
    <div class="cfg-group">
      <label for="army-name-input">Army Name</label>
      <input type="text" id="army-name-input" placeholder="Name your force"

let state = {
  factionId: null,
  armyName:  "",
  pointsLimit: 100,
  command:  null,  // { unitId, uid }
  units:    []     // [{ uid, unitId, category, models, notes }]

// ══════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════
function getFaction() {
  return FACTIONS.find(f => f.id === state.factionId);
}

function getDef(unitId, cat) {
  const f = getFaction();
  if (!f) return null;
  if (cat === 'cmd')     return f.commandTeams.find(u => u.id === unitId);
  if (cat === 'core')    return f.coreUnits.find(u => u.id === unitId);
  if (cat === 'support') return f.supportUnits.find(u => u.id === unitId);
}

function selectedUpgradeIds(entry) {
  return Array.isArray(entry?.upgrades) ? entry.upgrades : [];
}

function upgradeCost(entry, def) {
  const selected = selectedUpgradeIds(entry);
  if (!def?.upgrades?.length || !selected.length) return 0;
  return def.upgrades.reduce((sum, up) => sum + (selected.includes(up.id) ? up.cost : 0), 0);
}

function unitBaseCost(entry, def) {
  if (!def) return 0;
  if (def.scalable) return def.baseCost + (entry.models - def.baseModels) * def.extraCostPerModel;
  return def.cost !== undefined ? def.cost : def.baseCost;
}

function unitCost(entry) {
  const d = getDef(entry.unitId, entry.category);
  return unitBaseCost(entry, d) + upgradeCost(entry, d);
}

function commandCost() {
  const d = state.command ? getDef(state.command.unitId, 'cmd') : null;
  if (!d) return 0;
  return (d.cost ?? 0) + upgradeCost(state.command, d);
}

function totalPts() {
  return commandCost() + state.units.reduce((s, e) => s + unitCost(e), 0);
}

function coreCount() { return state.units.filter(e => e.category === 'core').length; }
function supportCount() { return state.units.filter(e => { const d = getDef(e.unitId, e.category); return e.category === 'support' && !d?.isBarrage; }).length; }
function totalSupportCount() { return state.units.filter(e => e.category === 'support').length; }
function countOf(id) { return state.units.filter(e => e.unitId === id).length; }
function groupCount(groupId) {
  const f = getFaction();
  if (!f) return 0;
  return state.units.filter(e => {
    const d = f.supportUnits.find(u => u.id === e.unitId);
    return d && d.groupId === groupId;
  }).length;
}

function canAddCore(def) {
  if (coreCount() >= 6) return false;
  if (def.unique && countOf(def.id) >= 1) return false;
  if (def.maxUnits !== null && countOf(def.id) >= def.maxUnits) return false;
  return true;
}
function canAddSupport(def) {
  if (!def.isBarrage && supportCount() >= coreCount()) return false;
  if (def.unique && countOf(def.id) >= 1) return false;
  if (def.maxUnits !== null && countOf(def.id) >= def.maxUnits) return false;
  if (def.groupId && groupCount(def.groupId) >= def.groupMax) return false;
  return true;
}

function validate() {
  const f    = getFaction();
  const errs = [], oks = [], warns = [];
  state.command ? oks.push("Command team selected") : errs.push("Command team required (1)");
  const cc = coreCount();
  cc >= 2 ? oks.push(`Core units: ${cc} (min 2 ✓)`) : errs.push(`Core units: ${cc}/2 required`);
  const pts = totalPts();
  pts <= state.pointsLimit ? oks.push(`Points: ${pts}/${state.pointsLimit}`) : errs.push(`Over limit by ${pts - state.pointsLimit} pts`);
  const sc = supportCount();
  const supportCap = coreCount();
  const barrageCount = state.units.filter(e => { const d = getDef(e.unitId, e.category); return e.category === 'support' && d?.isBarrage; }).length;
  sc <= supportCap ? oks.push(`Support units: ${sc}/${supportCap} allowed${barrageCount ? ` · Barrages: ${barrageCount} (do not count toward support cap)` : ''}`) : errs.push(`Too many non-barrage support units: ${sc}/${supportCap} allowed`);
  if (f && f.id === 'villistas') {
    const cavCount = state.units.filter(e => e.category === 'core' && e.unitId === 'cav_vil').length;
    cavCount >= 2 ? oks.push('Villistas Cavalry: 2 required (✓)') : warns.push(`Villistas Cavalry: ${cavCount}/2 required (faction special rule)`);
  }
  return { errs, oks, warns, valid: errs.length === 0 };
}

// PERSISTENCE
// ══════════════════════════════════════════════════════════════════
const SAVES_KEY = 'bv_saves_v2';
const AUTO_KEY  = 'bv_autosave_v2';

function stateSnapshot() {
  return {
    factionId:   state.factionId,
    armyName:    state.armyName,
    pointsLimit: state.pointsLimit,
    command:     state.command ? { unitId: state.command.unitId, upgrades: selectedUpgradeIds(state.command) } : null,
    units: state.units.map(e => ({ unitId:e.unitId, category:e.category, models:e.models, upgrades:selectedUpgradeIds(e), notes:e.notes||'' }))
  };
}

function applySnapshot(snap) {
  state.armyName    = snap.armyName    || '';
  state.pointsLimit = snap.pointsLimit || 100;
  state.command     = snap.command ? { unitId: snap.command.unitId, uid: newUid(), upgrades: snap.command.upgrades || [] } : null;
  state.units       = (snap.units || []).map(u => ({
    uid: newUid(), unitId: u.unitId, category: u.category, models: u.models, upgrades: u.upgrades || [], notes: u.notes||''
  }));
  document.getElementById('army-name-input').value    = state.armyName;
  document.getElementById('points-limit-input').value = state.pointsLimit;
}

function autoSave() {
  try { localStorage.setItem(AUTO_KEY, JSON.stringify(stateSnapshot())); } catch(e) {}
}

function getSaves()   { try { return JSON.parse(localStorage.getItem(SAVES_KEY) || '{}'); } catch(e) { return {}; } }

function saveArmy() {
  const name = prompt('Save army as:', state.armyName || 'My Army');
  if (!name || !name.trim()) return;
  const key   = name.trim();
  const saves = getSaves();
  saves[key]  = { ...stateSnapshot(), armyName: key, savedAt: new Date().toLocaleDateString() };
  try {
    localStorage.setItem(SAVES_KEY, JSON.stringify(saves));
    showToast(`Saved "${key}"`);
    if (document.getElementById('save-modal').style.display !== 'none') renderSaveList();
  } catch(e) { alert('Could not save — localStorage may be full.'); }
}

function calcSavedPts(snap) {
  const f = FACTIONS.find(f => f.id === snap.factionId);
  if (!f) return 0;
  const savedUpgradeCost = (entry, def) => {
    const selected = Array.isArray(entry?.upgrades) ? entry.upgrades : [];
    if (!def?.upgrades?.length || !selected.length) return 0;
    return def.upgrades.reduce((sum, up) => sum + (selected.includes(up.id) ? up.cost : 0), 0);
  };
  const cmdDef = snap.command ? f.commandTeams.find(u => u.id === snap.command.unitId) : null;
  const cmdCost = cmdDef ? (cmdDef.cost ?? 0) + savedUpgradeCost(snap.command, cmdDef) : 0;
  return cmdCost + (snap.units || []).reduce((sum, e) => {
    const def = f.coreUnits.find(u => u.id === e.unitId) || f.supportUnits.find(u => u.id === e.unitId);
    if (!def) return sum;
    const base = def.scalable ? def.baseCost + (e.models - def.baseModels) * def.extraCostPerModel : def.cost;
    return sum + base + savedUpgradeCost(e, def);
  }, 0);
}

function loadArmy(name) {
  const saves = getSaves();
  if (!saves[name]) return;
  const snap = saves[name];
  if (!FACTIONS.find(f => f.id === snap.factionId)) {
    alert('This save uses an unrecognized faction.'); return;
  }
  state.factionId = snap.factionId;
  showBuilder();
  applySnapshot(snap);
  closeSaveManager();
  render();
  showToast(`Loaded "${name}"`);
}

function deleteArmy(name, event) {
  event.stopPropagation();
  if (!confirm(`Delete "${name}"?`)) return;
  const saves = getSaves();
  delete saves[name];
  localStorage.setItem(SAVES_KEY, JSON.stringify(saves));
  renderSaveList();
  showToast(`Deleted "${name}"`);
}

function openSaveManager()  { document.getElementById('save-modal').style.display = 'flex'; renderSaveList(); }
function closeSaveManager() { document.getElementById('save-modal').style.display = 'none'; }

function renderSaveList() {
  const saves = getSaves();
  const keys  = Object.keys(saves);
  const box   = document.getElementById('save-list');
  if (!keys.length) {
    box.innerHTML = '<div class="modal-empty">No saved armies yet.<br>Build a list and click "Save Army".</div>';
    return;
  }
  box.innerHTML = keys.map(k => {
    const s    = saves[k];
    const f    = FACTIONS.find(f => f.id === s.factionId);
    const pts  = calcSavedPts(s);
    const cnt  = (s.units||[]).length + (s.command ? 1 : 0);
    const fLbl = f ? `${f.name} · ` : '';
    return `<div class="save-slot">
      <div>
        <div class="save-slot-name">${esc(k)}</div>
        <div class="save-slot-meta">${fLbl}${cnt} unit${cnt!==1?'s':''} · ${pts} pts${s.savedAt?' · '+esc(s.savedAt):''}</div>
      </div>
      <div class="save-slot-btns">
        <button class="btn-slot-load" onclick="loadArmy(${JSON.stringify(k)})">Load</button>
        <button class="btn-slot-del"  onclick="deleteArmy(${JSON.stringify(k)}, event)">&#10005;</button>
      </div>
    </div>`;
  }).join('');
}

// TOAST
// ══════════════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// RENDER HELPERS
// ══════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function miniStats(def) {
  if (!def.stats) return '<div class="unit-meta" style="font-style:italic;">Barrage — no stat line</div>';
  const cols = [
    ['Shoot', def.stats.shoot], ['C.Combat', def.stats.cc],
    ['Sh.Save', def.stats.shootSave], ['CC.Save', def.stats.ccSave],
    ['Resolve', def.stats.resolve], ['Init', def.initiative],
    ['Cost', def.scalable ? (def.baseCost + '+') : def.cost],
  ];
  if (def.cmdPoints !== undefined) {
    cols.push(['Cmd Pts', def.cmdPoints]);
    cols.push(['Cmd Rng', def.cmdRange]);
  }
  return '<div class="mini-stats">' +
    cols.map(([k,v]) =>
      `<div class="stat-cell"><div class="stat-val">${esc(String(v))}</div><div class="stat-key">${esc(k)}</div></div>`
    ).join('') + '</div>';
}

function upgradeLabel(up) {
  return up?.name || up?.label || up?.id || 'Upgrade';
}

function upgradesMeta(def) {
  if (!def?.upgrades?.length) return '';
  return `<br><strong>Upgrades:</strong> ${esc(def.upgrades.map(u => `${upgradeLabel(u)} (+${u.cost} pts)`).join('; '))}`;
}

function upgradeControls(entry, def, target) {
  if (!def?.upgrades?.length) return '';
  const selected = selectedUpgradeIds(entry);
  return `<div class="upgrade-list">${def.upgrades.map(up => {
    const checked = selected.includes(up.id) ? 'checked' : '';
    return `<label class="upgrade-check"><input type="checkbox" ${checked} onchange="toggleUpgrade('${target}', '${up.id}')"> ${esc(upgradeLabel(up))} <strong>+${up.cost} pts</strong></label>`;
  }).join('')}</div>`;
}

function upgradeSummary(entry, def) {
  const selected = selectedUpgradeIds(entry);
  if (!def?.upgrades?.length || !selected.length) return '';
  return def.upgrades.filter(up => selected.includes(up.id)).map(up => `${upgradeLabel(up)} (+${up.cost} pts)`).join('; ');
}

// ══════════════════════════════════════════════════════════════════
function renderLanding() {
  normalizeFactionData();

  const sources = [...new Set(FACTIONS.map(f => factionSource(f)))].sort((a,b)=>a.localeCompare(b));
  const nations = [...new Set(FACTIONS.map(f => factionNation(f)))].sort((a,b)=>a.localeCompare(b));
  const q = (landingFilters.search || '').trim().toLowerCase();

  const filtered = FACTIONS.filter(f => {
    const source = factionSource(f);
    const nation = factionNation(f);
    const haystack = `${f.name || ''} ${f.subtitle || ''} ${f.theater || ''} ${source} ${nation} ${f.motto || ''}`.toLowerCase();
    return (landingFilters.source === 'all' || source === landingFilters.source)
      && (landingFilters.nation === 'all' || nation === landingFilters.nation)
      && (!q || haystack.includes(q));
  });

  let html = `<div class="filter-bar">
    <div class="filter-group">
      <label for="landing-group">Group by</label>
      <select id="landing-group" onchange="landingFilters.groupBy=this.value; renderLanding()">
        <option value="theater" ${landingFilters.groupBy==='theater'?'selected':''}>Theater</option>
        <option value="source" ${landingFilters.groupBy==='source'?'selected':''}>Source</option>
        <option value="nation" ${landingFilters.groupBy==='nation'?'selected':''}>Faction / Nation</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="landing-source">Source</label>
      <select id="landing-source" onchange="landingFilters.source=this.value; renderLanding()">
        ${landingControlOptions(sources, landingFilters.source, 'All Sources')}
      </select>
    </div>
    <div class="filter-group">
      <label for="landing-nation">Faction / Nation</label>
      <select id="landing-nation" onchange="landingFilters.nation=this.value; renderLanding()">
        ${landingControlOptions(nations, landingFilters.nation, 'All Factions')}
      </select>
    </div>
    <div class="filter-group">
      <label for="landing-search">Search</label>
      <input id="landing-search" type="search" value="${esc(landingFilters.search)}"
             placeholder="Faction, theater, source..."
             oninput="landingFilters.search=this.value; renderLanding()">
    </div>
  </div>`;

  if (!filtered.length) {
    html += `<div class="no-factions">No force lists match the current filters.</div>`;
    document.getElementById('land-content').innerHTML = html;
    return;
  }

  const groups = {};
  for (const f of filtered) {
    const label = landingGroupLabel(f);
    if (!groups[label]) groups[label] = [];
    groups[label].push(f);
  }

  for (const [label, factions] of Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]))) {
    html += `<div class="theater-block">
      <div class="theater-label">${esc(label)}</div>
      <div class="faction-grid">`;
    for (const f of factions) {
      html += `<div class="faction-card" onclick="pickFaction('${f.id}')">
        <span class="fc-arrow">&#8594;</span>
        <div class="fc-name">${esc(f.name)}</div>
        <div class="fc-sub">${esc(f.subtitle || '')}</div>
        <div class="fc-meta">${esc(factionNation(f))} · ${esc(factionSource(f))}</div>
        <div class="fc-motto">${esc(f.motto || '')}</div>
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('land-content').innerHTML = html;
}

function showBuilder() {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('builder').style.display = 'block';
  const f = getFaction();
  if (f) {
    document.getElementById('hdr-title').textContent = `Blood & Valor — ${f.name}`;
    document.getElementById('hdr-faction').textContent = `${f.subtitle} · Source: ${factionSource(f)}`;
    document.getElementById('hdr-motto').textContent   = f.motto;
  }
}

function pickFaction(id) {
  state.factionId  = id;
  state.armyName   = '';
  state.pointsLimit = 100;
  state.command    = null;
  state.units      = [];
  showBuilder();
  document.getElementById('army-name-input').value    = '';
  document.getElementById('points-limit-input').value = 100;
  render();
}

function goHome() {
  document.getElementById('landing').style.display = 'block';
  document.getElementById('builder').style.display = 'none';
}

function renderSupPanel() {

    const d = getDef(state.command.unitId, 'cmd');

      <div class="list-row-top">

              <div class="stepper">
                <button onclick="chgModels(${e.uid},-1)">&#8722;</button>
                <span class="mdl-count">${e.models}</span>
                <button onclick="chgModels(${e.uid},1)">+</button>
              </div>
              <span class="mdl-label">mdls</span>
            ` : ''}
            <div class="list-cost">${unitCost(e)} pts</div>
            <button class="btn-remove" onclick="removeUnit(${e.uid})" title="Remove">&#10005;</button>
          </div>
        </div>
        ${upgradeControls(e, d, e.uid)}
        <input class="unit-notes-input" type="text" placeholder="Notes for this unit..."
               value="${esc(e.notes||'')}" maxlength="150"
               oninput="updateNote(${e.uid}, this.value)">
      </div>`;
    }
  }
  document.getElementById('list-body').innerHTML = html;
}

// ══════════════════════════════════════════════════════════════════
// RENDER MAIN
// ══════════════════════════════════════════════════════════════════
function render() {
  renderCmdPanel();
  renderCorePanel();
  renderSupPanel();
  renderList();

  const { errs, oks, warns } = validate();
  document.getElementById('val-bar').innerHTML =
    oks.map(m   => `<div class="v-ok">${esc(m)}</div>`).join('') +
    warns.map(m  => `<div class="v-warn">${esc(m)}</div>`).join('') +
    errs.map(m  => `<div class="v-err">${esc(m)}</div>`).join('');

  const pts  = totalPts();
  const over = pts > state.pointsLimit;
  document.getElementById('pts-display').innerHTML =
    `<span class="${over?'over':'ok'}">${pts}</span> / ${state.pointsLimit}`;
  document.getElementById('total-display').innerHTML =
    `<span class="${over?'over':'ok'}">${pts} pts</span>`;

  autoSave();
}

// ══════════════════════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════════════════════
function selectCmd(id) {
  state.command = (state.command?.unitId === id) ? null : { unitId:id, uid:newUid(), upgrades:[] };
  render();
}
function removeCmd() { state.command = null; render(); }

function addUnit(id, cat) {
  const def = getDef(id, cat);
  if (!def) return;
  if (cat === 'core'    && !canAddCore(def))    return;
  if (cat === 'support' && !canAddSupport(def)) return;
  state.units.push({ uid:newUid(), unitId:id, category:cat, models:def.scalable?def.baseModels:null, upgrades:[], notes:'' });
  render();
}

function removeUnit(u) { state.units = state.units.filter(e => e.uid !== u); render(); }

function chgModels(u, delta) {
  const entry = state.units.find(e => e.uid === u);
  if (!entry) return;
  const def  = getDef(entry.unitId, entry.category);
  if (!def?.scalable) return;
  const next = entry.models + delta;
  if (next < def.baseModels || next > def.maxModels) return;
  entry.models = next;
  render();
}

function updateNote(u, val) {
  const entry = state.units.find(e => e.uid === u);
  if (entry) { entry.notes = val; autoSave(); }
}

function toggleUpgrade(target, upgradeId) {
  const entry = target === 'cmd' ? state.command : state.units.find(e => e.uid === Number(target));
  if (!entry) return;
  entry.upgrades = selectedUpgradeIds(entry).includes(upgradeId)
    ? selectedUpgradeIds(entry).filter(id => id !== upgradeId)
    : [...selectedUpgradeIds(entry), upgradeId];
  render();
}

function clearArmy() {
  if (!confirm('Clear the current army?')) return;
  state.command = null;
  state.units   = [];
  render();
}

// Normalize data from generated expansion blocks so both {name: ...} and {label: ...}
// upgrade formats work consistently in the builder, saves, and print output.
function normalizeFactionData() {
  for (const f of FACTIONS) {
    for (const bucket of ['commandTeams', 'coreUnits', 'supportUnits']) {
      for (const unit of (f[bucket] || [])) {
        if (!Array.isArray(unit.specialRules)) unit.specialRules = [];
        if (Array.isArray(unit.upgrades)) {
          for (const up of unit.upgrades) {
            if (!up.name && up.label) up.name = up.label;
            if (!up.label && up.name) up.label = up.name;
          }
        }
      }
    }
  }
}
normalizeFactionData();

// LANDING FILTERS, SOURCE, AND FACTION METADATA
// ══════════════════════════════════════════════════════════════════
let landingFilters = { groupBy:'theater', source:'all', nation:'all', search:'' };

function inferFactionSource(f) {
  const id = String(f?.id || '').toLowerCase();
  if (id.startsWith('eoe_')) return 'End of Empires';
  if (id === 'russian_wwi') return 'Russian Imperial Army PDF';
  if (['american_mi','villistas','zapatistas','carrancistas','federal'].includes(id)) return 'The Mexican Intervention Supplement';
  if (['russian_rjw','japanese'].includes(id)) return 'Russo-Japanese War Supplement';
  return 'Blood and Valor';
}

function inferFactionNation(f) {
  if (!f) return 'Other';
  const id = String(f.id || '').toLowerCase();
  const name = String(f.name || '').toLowerCase();
  const subtitle = String(f.subtitle || '').toLowerCase();
  const text = `${id} ${name} ${subtitle}`;

  // Explicit ID-first rules prevent source/theater names like "Russo-Japanese War" from misclassifying Russian lists as Japanese.
  if (id === 'russian_wwi' || id === 'russian_rjw' || id.startsWith('eoe_russian') ||
      id === 'eoe_free_russia' || id === 'eoe_pro_bolshevik' || id === 'eoe_anti_bolshevik' ||
      id === 'eoe_kerensky_krasnov' || id === 'eoe_prikamye' || id.startsWith('eoe_red_') ||
      id === 'eoe_partizanshchina' || id === 'eoe_don_army' || id === 'eoe_atamanshchina' ||
      id === 'eoe_povolzhye' || id === 'eoe_green_peasants' || id.startsWith('eoe_volunteer') ||
      id === 'eoe_siberian_white' || id === 'eoe_northern_russia') return 'Russian';

  if (id === 'japanese' || id === 'eoe_japanese_far_east' || name.includes('japanese')) return 'Japanese';
  if (id.startsWith('british') || id === 'eoe_ric' || name.includes('british') || name.includes('royal irish constabulary')) return 'British';
  if (id === 'anzac' || text.includes('anzac') || text.includes('australian and new zealand')) return 'ANZAC';
  if (id.startsWith('german') || id === 'eoe_german_east' || name.includes('german')) return 'German';
  if (id.startsWith('french') || name.includes('french')) return 'French';
  if (id.startsWith('ottoman') || name.includes('ottoman')) return 'Ottoman';
  if (id.startsWith('american') || name.includes('american')) return 'American';
  if (id.startsWith('belgian') || name.includes('belgian')) return 'Belgian';
  if (['villistas','zapatistas','carrancistas','federal'].includes(id) || name.includes('mexican') ||
      name.includes('división del norte') || name.includes('libertador del sur') || name.includes('constitutional army')) return 'Mexican';

  if (id === 'eoe_italy_1915' || name.includes('italian')) return 'Italian';
  if (id === 'eoe_austrohungarian_1914' || name.includes('austro-hungarian') || name.includes('austrian')) return 'Austro-Hungarian';
  if (id === 'eoe_greek' || name.includes('greek') || name.includes('hellenic')) return 'Greek';
  if (id === 'eoe_romanian' || name.includes('romanian')) return 'Romanian';
  if (id === 'eoe_bulgarian' || name.includes('bulgarian')) return 'Bulgarian';
  if (id === 'eoe_serbian' || name.includes('serbian')) return 'Serbian';
  if (id.startsWith('eoe_ukrainian') || id === 'eoe_black_anarchist' || name.includes('ukrainian') || name.includes('makhno')) return 'Ukrainian';
  if (id === 'eoe_czechoslovak_legion' || name.includes('czechoslovak')) return 'Czechoslovak';
  if (id.startsWith('eoe_polish') || id === 'eoe_greater_poland' || name.includes('polish') || name.includes('greater poland')) return 'Polish';
  if (id === 'eoe_chinese_warlords' || name.includes('chinese')) return 'Chinese';
  if (id === 'eoe_portuguese' || name.includes('portuguese') || name.includes('corpo expedicion')) return 'Portuguese';
  if (id === 'eoe_irish_volunteers' || name.includes('irish volunteers')) return 'Irish';

  return 'Other';
}

function factionSource(f) {
  return f?.source || inferFactionSource(f);
}

function factionNation(f) {
  return f?.nation || inferFactionNation(f);
}

function landingGroupLabel(f) {
  if (landingFilters.groupBy === 'source') return factionSource(f);
  if (landingFilters.groupBy === 'nation') return factionNation(f);
  return f.theater || 'Unsorted';
}

function landingControlOptions(values, selected, allLabel) {
  return [`<option value="all" ${selected==='all'?'selected':''}>${esc(allLabel)}</option>`]
    .concat(values.map(v => `<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(v)}</option>`))
    .join('');
}

function normalizeFactionData() {
  for (const f of FACTIONS) {
    f.source = inferFactionSource(f);
    f.nation = inferFactionNation(f);
    for (const bucket of ['commandTeams', 'coreUnits', 'supportUnits']) {
      for (const unit of (f[bucket] || [])) {
        if (!Array.isArray(unit.specialRules)) unit.specialRules = [];
        unit.source = unit.source || f.source;
        unit.nation = unit.nation || f.nation;
        if (Array.isArray(unit.upgrades)) {
          for (const up of unit.upgrades) {
            if (!up.name && up.label) up.name = up.label;
            if (!up.label && up.name) up.label = up.name;
          }
        }
      }
    }
  }
}

function cardStatTable(def) {
  if (!def.stats) return '<div class="barrage-placeholder">Barrage — no stat line</div>';
  const cols = [
    ['Shoot', def.stats.shoot], ['Close Combat', def.stats.cc],
    ['Shoot Save', def.stats.shootSave], ['CC Save', def.stats.ccSave],
    ['Resolve', def.stats.resolve], ['Initiative', def.initiative],
    ['Cost', def.scalable ? (def.baseCost + '+') : def.cost],
  ];
  if (def.cmdPoints !== undefined) {
    cols.push(['Cmd Range', def.cmdRange]);
    cols.push(['Cmd Points', def.cmdPoints]);
  }
  const hdrs  = cols.map(([h])  => `<th>${esc(h)}</th>`).join('');
  const cells = cols.map(([,v]) => `<td>${esc(String(v))}</td>`).join('');
  return `<table class="card-stat-table"><thead><tr>${hdrs}</tr></thead><tbody><tr>${cells}</tr></tbody></table>`;
}

function ruleBaseName(rule) {
  let s = String(rule || '').trim();
  if (!s) return '';
  s = s.replace(/\s*\([^)]*\)\s*$/,'').trim();
  const colon = s.indexOf(':');
  if (colon > -1) s = s.slice(0, colon).trim();
  if (/^Die Hard\b/i.test(s)) return 'Die Hard';
  if (/^Close Combat Specialist\b/i.test(s)) return 'Close Combat Specialists';
  if (/^Scarce Ammo/i.test(s)) return 'Scarce Ammo';
  if (/^Will of the People/i.test(s)) return 'Will of the People!';
  if (/^For the Ataman/i.test(s)) return 'For the Ataman!';
  if (/^Long Live Anarchy/i.test(s)) return 'Long Live Anarchy!';
  if (/^Long Live Free Ukraine/i.test(s)) return 'Long Live Free Ukraine';
  return s;
}

function specialRulesDetailed(def) {
  const rules = def.specialRules || [];
  if (!rules.length) return '';
  return rules.map(rule => {
    const label = String(rule).trim();
    const base = ruleBaseName(label);
    const defText = SPECIAL_RULE_DEFS[base];
    if (defText) return `<div class="card-rule"><strong>${esc(label)}:</strong> ${esc(defText)}</div>`;
    const colon = label.indexOf(':');
    if (colon > -1) {
      return `<div class="card-rule"><strong>${esc(label.slice(0, colon).trim())}:</strong> ${esc(label.slice(colon + 1).trim())}</div>`;
    }
    return `<div class="card-rule"><strong>${esc(label)}</strong></div>`;
  }).join('');
}

function buildCard(entry) {
  const def  = getDef(entry.unitId, entry.category);
  if (!def)  return '';
  const rawCost = entry.category === 'cmd' ? (def.cost ?? 0) + upgradeCost(entry, def) : unitCost(entry);
  const cost = entry.category === 'cmd' && rawCost === 0 ? 'FREE' : rawCost + ' pts';
  const comp = def.scalable && entry.models ? def.composition + ` — ${entry.models} models in list` : def.composition;
  const sub  = entry.category === 'cmd'
    ? `Commander · ${def.cmdPoints} Cmd Pt · ${def.cmdRange} · ${cost}`
    : `${def.type || ''} · ${cost}`;
  return `<div class="unit-card">
    <div class="card-header">
      <div class="card-title">${esc(def.name)}</div>
      <div class="card-sub">${esc(sub)}</div>
      <div class="card-source">Source: ${esc(def.source || factionSource(getFaction()))}</div>
    </div>
    ${cardStatTable(def)}
    <div class="card-info"><strong>Composition:</strong> ${esc(comp)}</div>
    ${def.specialRules?.length ? `<div class="card-info"><strong>Special Rules:</strong>${specialRulesDetailed(def)}</div>` : ''}
    <div class="card-info"><strong>Weapons:</strong> ${esc(def.weapons)}</div>
    ${upgradeSummary(entry, def) ? `<div class="card-info"><strong>Upgrades:</strong> ${esc(upgradeSummary(entry, def))}</div>` : ''}
    ${def.lore ? `<div class="card-info" style="font-style:italic;color:#555;"><strong>Background:</strong> ${esc(def.lore)}</div>` : ''}
    ${entry.notes ? `<div class="card-info card-notes"><strong>Notes:</strong> ${esc(entry.notes)}</div>` : ''}
  </div>`;
}

function printStandaloneDocument(printBodyHtml) {
  const iframe = document.createElement('iframe');
  iframe.setAttribute('title', 'Print Army List');
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  iframe.style.visibility = 'hidden';
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>Army List Printout</title><style>${PRINT_DOCUMENT_CSS}</style></head><body>${printBodyHtml}</body></html>`);
  doc.close();

  const cleanup = () => {
    setTimeout(() => {
      if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    }, 750);
  };

  iframe.onload = () => {
    iframe.contentWindow.focus();
    iframe.contentWindow.onafterprint = cleanup;
    iframe.contentWindow.print();
    setTimeout(cleanup, 2000);
  };

  // Some mobile browsers do not reliably fire iframe.onload after document.write.
  setTimeout(() => {
    try {
      iframe.contentWindow.focus();
      iframe.contentWindow.onafterprint = cleanup;
      iframe.contentWindow.print();
      setTimeout(cleanup, 2000);
    } catch (err) {
      document.getElementById('print-view').innerHTML = printBodyHtml;
      window.print();
      cleanup();
    }
  }, 250);
}

function generatePrint() {
  const { valid, errs } = validate();
  if (!valid && !confirm(`Army is not complete:\n• ${errs.join('\n• ')}\n\nPrint anyway?`)) return;

  const f        = getFaction();
  const armyName = state.armyName || f.name;
  const pts      = totalPts();

  let html = `<div class="print-page">
    <div class="sum-header">
      <h1>${esc(armyName)}</h1>
      <div class="sum-faction">${esc(f.name)} · ${esc(f.subtitle)}</div>
      <div class="sum-source">Source: ${esc(factionSource(f))}</div>
      <div class="sum-motto">${esc(f.motto)}</div>
      <div class="sum-pts">${pts} / ${state.pointsLimit} Points</div>
      ${f.factionNote ? `<div class="sum-motto"><strong>Note:</strong> ${esc(f.factionNote)}</div>` : ''}
    </div>`;

  if (state.command) {
    const d = getDef(state.command.unitId, 'cmd');
    html += `<div class="sum-section"><h2>Command Team</h2>
      <div class="sum-row">
        <span class="sum-row-name">${esc(d.name)}</span>
        <span class="sum-row-detail">${d.cmdPoints} Cmd Pt · ${esc(d.cmdRange)} · ${esc(d.composition)}</span>
        <span class="sum-row-pts">${commandCost() === 0 ? 'FREE' : commandCost() + ' pts'}</span>
      </div>${upgradeSummary(state.command, d) ? `<div class="sum-row-notes">&#8618; ${esc(upgradeSummary(state.command, d))}</div>` : ''}</div>`;
  }

  const coreEntries = state.units.filter(e => e.category === 'core');
  if (coreEntries.length) {
    html += '<div class="sum-section"><h2>Core Units</h2>';
    for (const e of coreEntries) {
      const d = getDef(e.unitId, 'core');
      html += `<div class="sum-row">
        <span class="sum-row-name">${esc(d.name)}</span>
        <span class="sum-row-detail">${e.models} models · Init ${d.initiative}</span>
        <span class="sum-row-pts">${unitCost(e)} pts</span>
      </div>${upgradeSummary(e, d) ? `<div class="sum-row-notes">&#8618; ${esc(upgradeSummary(e, d))}</div>` : ''}${e.notes ? `<div class="sum-row-notes">&#8618; ${esc(e.notes)}</div>` : ''}`;
    }
    html += '</div>';
  }

  const supEntries = state.units.filter(e => e.category === 'support');
  if (supEntries.length) {
    html += '<div class="sum-section"><h2>Support Units</h2>';
    for (const e of supEntries) {
      const d      = getDef(e.unitId, 'support');
      const detail = d.scalable ? `${e.models} models · Init ${d.initiative}` : `Init ${d.initiative}`;
      html += `<div class="sum-row">
        <span class="sum-row-name">${esc(d.name)}</span>
        <span class="sum-row-detail">${detail}</span>
        <span class="sum-row-pts">${unitCost(e)} pts</span>
      </div>${upgradeSummary(e, d) ? `<div class="sum-row-notes">&#8618; ${esc(upgradeSummary(e, d))}</div>` : ''}${e.notes ? `<div class="sum-row-notes">&#8618; ${esc(e.notes)}</div>` : ''}`;
    }
    html += '</div>';
  }

  html += `</div>`;

  html += '<div class="cards-page"><div class="cards-grid">';
  if (state.command) html += buildCard({ ...state.command, category:'cmd', models:null, notes:'' });
  for (const e of state.units) html += buildCard(e);
  html += '</div></div>';

  // Keep a DOM preview/fallback, but print from an isolated document so the app
  // shell, CSS source, and hidden builder markup cannot leak into the PDF.
  document.getElementById('print-view').innerHTML = html;
  printStandaloneDocument(html);
}
